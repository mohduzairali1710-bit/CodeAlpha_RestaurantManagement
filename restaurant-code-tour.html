<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Management Code Tour</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0b1020;
        color: #e8eef9;
        font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: min(1100px, 100%);
      }

      h1 {
        font-size: 1.4rem;
        margin: 0 0 16px;
      }

      video {
        display: block;
        width: 100%;
        border: 1px solid #24314b;
        border-radius: 12px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CodeAlpha Restaurant Management — Code Tour</h1>
      <video controls preload="metadata">
        <source src="restaurant-code-tour.webm" type="video/webm">
        Your browser does not support WebM video.
      </video>
    </main>
  </body>
</html>
